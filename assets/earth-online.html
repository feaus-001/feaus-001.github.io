<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<title>地球Online · 成就</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161c26;
    --line: #263140;
    --fg: #e8eefc;
    --muted: #8b9ab8;
    --gold: #ffd166;
    --accent: #6ea8ff;
    --green: #4ade80;
    --pink: #ff7bb0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #16233d 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: .5px; }
  .ver { font-size: 11px; color: var(--muted); }
  .sub { color: var(--muted); font-size: 12.5px; margin: 4px 0 16px; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .stat i { font-style: normal; font-size: 11px; color: var(--muted); display: block; }
  .stat b { font-size: 24px; font-variant-numeric: tabular-nums; display: block; margin-top: 2px; }
  .stat small { font-size: 11px; color: var(--muted); }

  .actions { display: flex; gap: 10px; margin: 16px 0 22px; }
  button {
    flex: 1;
    font: inherit;
    font-size: 15px;
    padding: 13px 10px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: linear-gradient(180deg, #2f7cf6, #1f5fd0); border-color: #3b86ff; font-weight: 700; }
  button:disabled { opacity: .45; }
  button.stop { border-color: #e2556a; color: #ff8fa0; }

  h2 { font-size: 12px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin: 0 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    opacity: .55;
  }
  li.on { opacity: 1; border-color: rgba(255, 209, 102, .45); background: linear-gradient(180deg, #1d2532, #171e28); }
  .ico {
    width: 38px; height: 38px; flex: none;
    display: grid; place-items: center;
    border-radius: 10px;
    background: #0f1520;
    border: 1px solid var(--line);
    font-size: 19px;
    filter: grayscale(1);
  }
  li.on .ico { filter: none; border-color: rgba(255, 209, 102, .5); background: #241d0d; }
  .txt { min-width: 0; }
  .name { font-size: 14px; font-weight: 600; }
  .desc { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .xp { margin-left: auto; font-size: 11px; color: var(--gold); white-space: nowrap; }

  .hint { color: var(--muted); font-size: 11.5px; line-height: 1.7; margin-top: 18px; }
  .hint code { background: #1b2432; padding: 1px 5px; border-radius: 5px; }

  /* Steam 风格成就弹窗 */
  #toasts {
    position: fixed;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    z-index: 50;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1b2531 0%, #121a24 100%);
    border: 1px solid rgba(255, 209, 102, .4);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06);
    transform: translateY(24px);
    opacity: 0;
    transition: transform .32s cubic-bezier(.2, .9, .3, 1.2), opacity .32s ease;
  }
  .toast.show { transform: none; opacity: 1; }
  .toast .ico { width: 44px; height: 44px; font-size: 22px; filter: none; border-color: rgba(255, 209, 102, .5); background: #241d0d; }
  .toast .kick { font-size: 10px; letter-spacing: .16em; color: var(--gold); text-transform: uppercase; }
  .toast .name { font-size: 14.5px; margin-top: 2px; }
  .toast .desc { font-size: 11.5px; }
  @media (min-width: 620px) {
    #toasts { left: auto; width: 360px; }
  }
</style>
</head>
<body>
<header>
  <h1>地球Online</h1>
  <span class="ver">成就系统 · v1.0</span>
</header>
<p class="sub">用手机传感器记录你的现实行动：走路、移动、熬夜、早起。达成即弹「成就解锁」。<br>数据只存在本机，不上传。</p>

<section class="grid">
  <div class="stat"><i>今日步数</i><b id="s-steps">0</b><small>靠手机加速度估算</small></div>
  <div class="stat"><i>移动距离</i><b id="s-dist">0 m</b><small>靠定位位移累计</small></div>
  <div class="stat"><i>在线时长</i><b id="s-time">0 分</b><small>页面活跃时间</small></div>
  <div class="stat"><i>已解锁</i><b id="s-ach">0 / 10</b><small>成就进度</small></div>
</section>

<div class="actions">
  <button id="start" class="primary">开始游玩</button>
  <button id="stop" disabled>暂停</button>
</div>

<h2>成就列表</h2>
<ul id="list"></ul>

<p class="hint">
  · 首次点「开始游玩」会请求<code>运动与方向</code>和<code>位置</code>权限，允许后步数与距离才准；<br>
  · iOS 需要手势触发，所以必须先点按钮；<br>
  · 关闭页面后统计暂停，成就进度会保存。
</p>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  var ACH = [
    { id: 'login',  icon: '🌍', name: '初次登录',     desc: '你打开了地球Online。', xp: 10,  run: function () { return true; } },
    { id: 'step10', icon: '👣', name: '迈出第一步',   desc: '累计 10 步。',        xp: 20,  run: function (s) { return s.steps >= 10; } },
    { id: 'step1k', icon: '🏃', name: '千步行者',     desc: '单次游玩走满 1000 步。', xp: 60, run: function (s) { return s.steps >= 1000; } },
    { id: 'step5k', icon: '🥾', name: '万里长征',     desc: '单次游玩走满 5000 步。', xp: 200, run: function (s) { return s.steps >= 5000; } },
    { id: 'move500', icon: '📍', name: '位移人生',     desc: '移动超过 500 米。',   xp: 50,  run: function (s) { return s.distance >= 500; } },
    { id: 'move2k', icon: '🗺️', name: '城市漫游者',   desc: '移动超过 2 公里。',   xp: 150, run: function (s) { return s.distance >= 2000; } },
    { id: 'early',  icon: '🌅', name: '早起的鸟',     desc: '早上 6:30 前开始游玩。', xp: 80, run: function (s) { return s.earlyBird; } },
    { id: 'night',  icon: '🌙', name: '夜行生物',     desc: '晚上 23:30 后还在游玩。', xp: 80, run: function (s) { return s.nightOwl; } },
    { id: 'focus',  icon: '⏳', name: '持之以恒',     desc: '连续在线 30 分钟。', xp: 120, run: function (s) { return s.activeMs >= 30 * 60 * 1000; } },
    { id: 'lowbat', icon: '🔋', name: '电量告急',     desc: '电量低于 15% 仍在坚持。', xp: 60, run: function (s) { return s.battery < 0.15; } }
  ];

  var KEY = 'earth-online-v1';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }

  var state = {
    steps: 0,
    distance: 0,
    activeMs: 0,
    battery: 1,
    earlyBird: false,
    nightOwl: false,
    running: false
  };

  var startedAt = 0;
  var lastTick = 0;
  var lastStepAt = 0;
  var lastAcc = 0;
  var lastPos = null;
  var watchId = null;
  var motionBound = false;
  var timer = null;

  var els = {
    steps: document.getElementById('s-steps'),
    dist: document.getElementById('s-dist'),
    time: document.getElementById('s-time'),
    ach: document.getElementById('s-ach'),
    list: document.getElementById('list'),
    start: document.getElementById('start'),
    stop: document.getElementById('stop'),
    toasts: document.getElementById('toasts')
  };

  function fmtDist(m) {
    return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
  }
  function fmtTime(ms) {
    var min = Math.floor(ms / 60000);
    return min < 60 ? min + ' 分' : Math.floor(min / 60) + ' 时 ' + (min % 60) + ' 分';
  }

  function renderList() {
    els.list.innerHTML = ACH.map(function (a) {
      var on = !!saved[a.id];
      return '<li class="' + (on ? 'on' : '') + '">' +
        '<span class="ico">' + a.icon + '</span>' +
        '<span class="txt"><span class="name">' + a.name + '</span>' +
        '<span class="desc">' + (on ? '已解锁 · ' + a.desc : a.desc) + '</span></span>' +
        '<span class="xp">+' + a.xp + ' XP</span>' +
        '</li>';
    }).join('');
    els.ach.textContent = Object.keys(saved).length + ' / ' + ACH.length;
  }

  function renderStats() {
    els.steps.textContent = String(state.steps);
    els.dist.textContent = fmtDist(state.distance);
    els.time.textContent = fmtTime(state.activeMs);
  }

  function toast(a) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="ico">' + a.icon + '</span>' +
      '<span class="txt"><span class="kick">成就解锁</span>' +
      '<span class="name">' + a.name + '</span>' +
      '<span class="desc">' + a.desc + '</span></span>' +
      '<span class="xp">+' + a.xp + ' XP</span>';
    els.toasts.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 400);
    }, 4200);
    beep();
  }

  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
      o.connect(g).connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.32);
    } catch (e) { /* 静音播放被拦也无所谓 */ }
  }

  function check() {
    for (var i = 0; i < ACH.length; i++) {
      var a = ACH[i];
      if (saved[a.id]) continue;
      var ok = false;
      try { ok = a.run(state); } catch (e) { ok = false; }
      if (ok) {
        saved[a.id] = Date.now();
        try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { /* ignore */ }
        toast(a);
        renderList();
      }
    }
  }

  function tick() {
    if (!state.running) return;
    var now = Date.now();
    state.activeMs += Math.min(now - lastTick, 2000);
    lastTick = now;

    var h = new Date().getHours();
    var m = new Date().getMinutes();
    if (h < 6 || (h === 6 && m < 30)) state.earlyBird = true;
    if (h === 23 && m >= 30) state.nightOwl = true;
    if (h >= 0 && h < 3) state.nightOwl = true;

    renderStats();
    check();
  }

  function onMotion(e) {
    var acc = e.accelerationIncludingGravity || e.acceleration;
    if (!acc || acc.x == null) return;
    var mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
    var delta = Math.abs(mag - lastAcc);
    lastAcc = mag;
    var now = Date.now();
    if (delta > 11 && now - lastStepAt > 320) {
      lastStepAt = now;
      state.steps += 1;
    }
  }

  function onPos(p) {
    var c = p.coords;
    if (c.accuracy > 120) return;
    if (lastPos) {
      var R = 6371000;
      var dLat = (c.latitude - lastPos.latitude) * Math.PI / 180;
      var dLon = (c.longitude - lastPos.longitude) * Math.PI / 180;
      var lat1 = lastPos.latitude * Math.PI / 180;
      var lat2 = c.latitude * Math.PI / 180;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
      var d = 2 * R * Math.asin(Math.sqrt(a));
      if (d > 3 && d < 200) state.distance += d;
    }
    lastPos = { latitude: c.latitude, longitude: c.longitude };
  }

  async function initBattery() {
    try {
      if (navigator.getBattery) {
        var b = await navigator.getBattery();
        state.battery = b.level;
        b.addEventListener('levelchange', function () { state.battery = b.level; });
      }
    } catch (e) { /* 不支持就算了 */ }
  }

  async function requestMotion() {
    try {
      var D = window.DeviceMotionEvent;
      if (D && typeof D.requestPermission === 'function') {
        var res = await D.requestPermission();
        if (res !== 'granted') return false;
      }
      window.addEventListener('devicemotion', onMotion);
      return true;
    } catch (e) {
      return false;
    }
  }

  function startGeo() {
    try {
      if (!navigator.geolocation) return;
      watchId = navigator.geolocation.watchPosition(onPos, function () { /* 拒绝就算了 */ }, {
        enableHighAccuracy: true, maximumAge: 5000, timeout: 15000
      });
    } catch (e) { /* ignore */ }
  }

  async function start() {
    if (state.running) return;
    state.running = true;
    startedAt = Date.now();
    lastTick = Date.now();
    els.start.disabled = true;
    els.stop.disabled = false;

    var motionOk = await requestMotion();
    startGeo();
    initBattery();

    motionBound = motionOk;
    timer = setInterval(tick, 1000);
    tick();
    if (!motionOk) {
      console.warn('[地球Online] 运动传感器不可用，步数不会增长');
    }
  }

  function stop() {
    if (!state.running) return;
    state.running = false;
    clearInterval(timer);
    timer = null;
    els.start.disabled = false;
    els.stop.disabled = true;
    if (watchId != null && navigator.geolocation) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    renderStats();
  }

  els.start.addEventListener('click', start);
  els.stop.addEventListener('click', stop);

  // 首次进入即触发「初次登录」
  check();
  renderList();
  renderStats();

  // 调试钩子：?test=1 时可手动解锁一个成就，方便验证弹窗样式
  window.__EO__ = { state: state, saved: saved, unlock: function (id) {
    var a = ACH.filter(function (x) { return x.id === id; })[0];
    if (!a || saved[a.id]) return false;
    saved[a.id] = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    toast(a); renderList(); return true;
  } };
  if (location.search.indexOf('test=1') !== -1) {
    setTimeout(function () { window.__EO__.unlock('step10'); }, 800);
  }
})();
</script>
</body>
</html>
